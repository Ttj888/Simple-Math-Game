<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Math Game</title>
    <style>
        /* Add non-selectable text rules */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a2e; /* Darker, more purple background */
            color: #e0e0e0; /* Softer white */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            perspective: 800px;
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none; /* Firefox */
            -ms-user-select: none; /* IE/Edge */
            user-select: none; /* Standard syntax */
        }

        .game-container {
            background-color: rgba(26, 26, 46, 0.85); /* Slightly more opaque */
            padding: 2rem;
            border-radius: 30px; /* Roundify */
            box-shadow: none; /* Flat design */
            max-width: 400px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.1); /* Subtle border */
            transform-style: preserve-3d;
            transition: transform 0.2s ease-out;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        h1, .problem, .options-container, .feedback, .score, .timer, .difficulty-buttons {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        h1 {
            color: #f0a5d8; /* Softer pink */
            margin-bottom: 1rem;
            font-size: 2.5rem;
            text-shadow: 0 0 8px rgba(240, 165, 216, 0.5); /* Subtle glow */
        }

        .problem {
            font-size: 2rem;
            margin: 1rem 0;
            color: #e0e0e0;
            text-shadow: none; /* Flat design */
        }

        .options-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px; /* Increased gap */
            margin: 1rem 0;
        }

        .option-button {
            font-size: 1.2rem;
            padding: 0.75rem 1rem; /* More padding */
            background-color: transparent;
            color: #c792ea; /* Soft purple */
            border: 1px solid #c792ea;
            border-radius: 20px; /* Roundify */
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            margin-bottom: 0.5rem;
            text-shadow: none; /* Flat design */
        }

        .option-button:hover {
            background-color: rgba(199, 146, 234, 0.2); /* Subtle hover */
        }

        .option-button.selected {
            background-color: #c792ea;
            color: #1a1a2e;
            text-shadow: none;
        }

        .feedback {
            font-size: 1.2rem;
            margin: 1rem 0;
            padding: 0.5rem;
            border-radius: 15px; /* Roundify */
            animation: fadeIn 0.5s;
            text-shadow: none; /* Flat design */
        }

        .correct {
            color: #a5d8f0; /* Soft blue for correct */
            background-color: rgba(165, 216, 240, 0.1);
            animation: pop 0.5s;
        }

        .incorrect {
            color: #ff758f; /* Soft red for incorrect */
            background-color: rgba(255, 117, 143, 0.1);
            animation: pop 0.5s;
        }

        .score {
            font-size: 1.5rem;
            margin: 1rem 0;
            color: #f0a5d8;
            text-shadow: 0 0 8px rgba(240, 165, 216, 0.5); /* Subtle glow */
        }

        .timer {
            font-size: 1.2rem;
            margin: 1rem 0;
            color: #ffcc66; /* Softer yellow */
            text-shadow: none; /* Flat design */
        }

        .difficulty-buttons {
            margin: 1rem 0;
        }

        .difficulty-button {
            font-size: 1rem;
            padding: 0.5rem 1rem;
            background-color: transparent;
            color: #c792ea;
            border: 1px solid #c792ea;
            border-radius: 15px; /* Roundify */
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
            margin: 0 0.5rem;
        }

        .difficulty-button.active {
            background-color: #c792ea;
            color: #1a1a2e;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); } /* Softer pop */
            100% { transform: scale(1); }
        }
    </style>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Pure function to calculate the answer
    const calculateAnswer = (num1, num2, operator) => {
      switch (operator) {
        case '+': return num1 + num2;
        case '-': return num1 - num2;
        case '*': return num1 * num2;
        default: return 0;
      }
    };

    // Preload audio files
    const correctSound = new Audio('https://www.soundjay.com/button/beep-07.mp3');
    const incorrectSound = new Audio('https://www.soundjay.com/button/beep-08.mp3');

    function App() {
      const [num1, setNum1] = useState(0);
      const [num2, setNum2] = useState(0);
      const [operator, setOperator] = useState('+');
      const [correctAnswer, setCorrectAnswer] = useState(0);
      const [options, setOptions] = useState([]);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [feedback, setFeedback] = useState('');
      const [score, setScore] = useState(0);
      const [timeLeft, setTimeLeft] = useState(10);
      const [difficulty, setDifficulty] = useState('easy');
      const [highScore, setHighScore] = useState(() => localStorage.getItem('highScore') || 0);
      const gameContainerRef = useRef(null);
      const timerRef = useRef(null);

      // Generate unique options
      const generateOptions = useCallback((correct) => {
        const uniqueOptions = new Set([correct]);
        while (uniqueOptions.size < 9) {
          const randomOffset = Math.floor(Math.random() * 10) - 5;
          uniqueOptions.add(correct + randomOffset);
        }
        const shuffledOptions = Array.from(uniqueOptions).sort(() => Math.random() - 0.5);
        setOptions(shuffledOptions);
      }, []);

      // Generate a new math problem
      const generateProblem = useCallback(() => {
        let maxNum;
        switch (difficulty) {
          case 'easy':
            maxNum = 10;
            break;
          case 'medium':
            maxNum = 20;
            break;
          case 'hard':
            maxNum = 50;
            break;
          default:
            maxNum = 10;
        }

        const newNum1 = Math.floor(Math.random() * maxNum) + 1;
        const newNum2 = Math.floor(Math.random() * maxNum) + 1;
        const ops = ['+', '-', '*'];
        const newOperator = ops[Math.floor(Math.random() * ops.length)];

        let tempNum1 = newNum1;
        let tempNum2 = newNum2;

        if (newOperator === '-' && newNum2 > newNum1) {
          [tempNum1, tempNum2] = [newNum2, newNum1];
        }

        setNum1(tempNum1);
        setNum2(tempNum2);
        setOperator(newOperator);

        const newCorrectAnswer = calculateAnswer(tempNum1, tempNum2, newOperator);
        setCorrectAnswer(newCorrectAnswer);
        generateOptions(newCorrectAnswer);
        setSelectedAnswer(null);
        setTimeLeft(10);
      }, [difficulty, generateOptions]);

      // Check the selected answer
      const checkAnswer = useCallback((selected) => {
        if (selected === correctAnswer) {
          setFeedback('Correct! 🎉');
          setScore((prevScore) => prevScore + 1);
          correctSound.play();
        } else {
          setFeedback(`Incorrect. The correct answer was ${correctAnswer}. 😢`);
          incorrectSound.play();
        }
        generateProblem();
      }, [correctAnswer, generateProblem]);

      // Handle timer
      useEffect(() => {
        if (timerRef.current) clearInterval(timerRef.current);

        timerRef.current = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              setFeedback('Time’s up! 😢');
              generateProblem();
              return 10;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timerRef.current);
      }, [generateProblem]);

      // Update high score
      useEffect(() => {
        if (score > highScore) {
          setHighScore(score);
          localStorage.setItem('highScore', score);
        }
      }, [score, highScore]);

      // Initialize the game
      useEffect(() => {
        generateProblem();
      }, [difficulty, generateProblem]);

      // Handle mouse movement for 3D effect
      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!gameContainerRef.current) return;

          const container = gameContainerRef.current;
          const rect = container.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const mouseX = e.clientX;
          const mouseY = e.clientY;

          const rotateX = (mouseY - centerY) / 40;
          const rotateY = (mouseX - centerX) / 40;

          container.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        };

        document.addEventListener('mousemove', handleMouseMove);

        return () => {
          document.removeEventListener('mousemove', handleMouseMove);
        };
      }, []);

      return (
        <div className="App">
          <div className="game-container" ref={gameContainerRef}>
            <h1>Cyberpunk Math Game</h1>
            <div className="difficulty-buttons">
              <button
                className={`difficulty-button ${difficulty === 'easy' ? 'active' : ''}`}
                onClick={() => setDifficulty('easy')}
              >
                Easy
              </button>
              <button
                className={`difficulty-button ${difficulty === 'medium' ? 'active' : ''}`}
                onClick={() => setDifficulty('medium')}
              >
                Medium
              </button>
              <button
                className={`difficulty-button ${difficulty === 'hard' ? 'active' : ''}`}
                onClick={() => setDifficulty('hard')}
              >
                Hard
              </button>
            </div>
            <div className="problem">
              {num1} {operator} {num2} = ?
            </div>
            <div className="options-container">
              {options.map((option, index) => (
                <button
                  key={index}
                  className={`option-button ${selectedAnswer === option ? 'selected' : ''}`}
                  onClick={() => checkAnswer(option)}
                >
                  {option}
                </button>
              ))}
            </div>
            <div className={`feedback ${feedback.includes('Correct') ? 'correct' : 'incorrect'}`}>
              {feedback}
            </div>
            <div className="timer">Time Left: {timeLeft} ⏳</div>
            <div className="score">Score: {score} 🏆 | High Score: {highScore} 🚀</div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</body>
</html>
